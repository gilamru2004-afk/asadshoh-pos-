<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asadshoh Market POS</title>

<style>
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:#0f172a;
    color:white;
}
.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}
h2{margin-top:0;}
input,button,select{
    padding:8px;
    margin:5px;
    border-radius:6px;
    border:none;
}
button{
    cursor:pointer;
    font-weight:bold;
    background:#22c55e;
}
button.sell{background:#3b82f6;}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:6px;
    border-bottom:1px solid #334155;
    text-align:center;
}
.dashboard{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}
.stat{
    background:#111827;
    padding:15px;
    border-radius:8px;
    flex:1;
    text-align:center;
}
.receipt{
    background:white;
    color:black;
    width:300px;
    padding:15px;
    font-family:Courier New, monospace;
    display:none;
}
@media print{
    body *{visibility:hidden;}
    .receipt, .receipt *{visibility:visible;}
    .receipt{position:absolute;left:0;top:0;}
}
</style>
</head>
<body>

<div class="container">

<div class="card">
<h2>📦 Mahsulot qo‘shish</h2>
<input id="name" placeholder="Tovar nomi">
<input id="size" placeholder="Razmer">
<input id="qty" type="number" placeholder="Soni">
<input id="price" type="number" placeholder="Narxi">
<button onclick="store.add()">Qo‘shish</button>
</div>

<div class="card">
<h2>🛒 Sotish</h2>
<select id="sellSelect"></select>
<input id="sellQty" type="number" placeholder="Soni">
<button class="sell" onclick="store.sell()">Sotish</button>
</div>

<div class="card dashboard">
<div class="stat">
<h3>📅 Bugungi savdo</h3>
Summa: <span id="todaySum">0</span><br>
Dona: <span id="todayQty">0</span>
</div>
<div class="stat">
<h3>📊 Umumiy savdo</h3>
Summa: <span id="totalSum">0</span><br>
Dona: <span id="totalQty">0</span>
</div>
</div>

<div class="card">
<h2>🧾 Cheklar arxivi</h2>
<table>
<thead>
<tr>
<th>ID</th>
<th>Sana</th>
<th>Summa</th>
<th>Dona</th>
<th>Ko‘rish</th>
</tr>
</thead>
<tbody id="receiptTable"></tbody>
</table>
</div>

<div class="receipt" id="receipt"></div>

</div>

<script>

class MarketPOS{

constructor(){
    this.products=JSON.parse(localStorage.getItem("products"))||[];
    this.receipts=JSON.parse(localStorage.getItem("receipts"))||[];
    this.render();
}

save(){
    localStorage.setItem("products",JSON.stringify(this.products));
    localStorage.setItem("receipts",JSON.stringify(this.receipts));
}

add(){
    const name=nameInput.value.trim();
    const size=sizeInput.value.trim();
    const qty=parseInt(qtyInput.value);
    const price=parseInt(priceInput.value);
    if(!name||!size||!qty||!price) return alert("To‘liq kiriting");
    this.products.push({id:Date.now(),name,size,qty,price});
    this.save();
    this.render();
}

sell(){
    const id=parseInt(sellSelect.value);
    const qty=parseInt(sellQty.value);
    const product=this.products.find(p=>p.id===id);
    if(!product||qty<=0) return alert("Xato");
    if(product.qty<qty) return alert("Yetarli emas");
    product.qty-=qty;
    const total=qty*product.price;
    const now=new Date();
    const receipt={
        id:"R"+Date.now(),
        name:product.name,
        size:product.size,
        qty,
        price:product.price,
        total,
        date:now.toLocaleString(),
        raw:now.toISOString()
    };
    this.receipts.unshift(receipt);
    this.save();
    this.render();
    this.print(receipt);
}

print(r){
    const box=document.getElementById("receipt");
    box.style.display="block";
    box.innerHTML=`
    <center>
    <b>ASADSHOH MARKET</b><br>
    101-do‘kon<br>
    Murojaat uchun tel:<br>
    +998 99 086 75 05<br>
    --------------------------</center>
    Chek ID: ${r.id}<br>
    ${r.name} (${r.size})<br>
    ${r.qty} x ${r.price}<br>
    --------------------------<br>
    JAMI: <b>${r.total} so‘m</b><br>
    Sotilgan dona: ${r.qty}<br>
    --------------------------<br>
    ${r.date}<br>
    <center>Rahmat!</center>
    <br><button onclick="window.print()">🖨 Chop</button>
    `;
}

render(){
    sellSelect.innerHTML="";
    receiptTable.innerHTML="";
    let todaySum=0,todayQty=0,totalSum=0,totalQty=0;
    const today=new Date().toDateString();

    this.products.forEach(p=>{
        if(p.qty>0)
        sellSelect.innerHTML+=`<option value="${p.id}">${p.name} (${p.size}) - ${p.qty}</option>`;
    });

    this.receipts.forEach(r=>{
        totalSum+=r.total;
        totalQty+=r.qty;
        if(new Date(r.raw).toDateString()===today){
            todaySum+=r.total;
            todayQty+=r.qty;
        }
        receiptTable.innerHTML+=`
        <tr>
        <td>${r.id}</td>
        <td>${r.date}</td>
        <td>${r.total}</td>
        <td>${r.qty}</td>
        <td><button onclick='store.print(${JSON.stringify(r)})'>Ko‘rish</button></td>
        </tr>`;
    });

    todaySumSpan.innerText=todaySum;
    todayQtySpan.innerText=todayQty;
    totalSumSpan.innerText=totalSum;
    totalQtySpan.innerText=totalQty;
}

}

const nameInput=document.getElementById("name");
const sizeInput=document.getElementById("size");
const qtyInput=document.getElementById("qty");
const priceInput=document.getElementById("price");
const sellSelect=document.getElementById("sellSelect");
const sellQty=document.getElementById("sellQty");
const receiptTable=document.getElementById("receiptTable");
const todaySumSpan=document.getElementById("todaySum");
const todayQtySpan=document.getElementById("todayQty");
const totalSumSpan=document.getElementById("totalSum");
const totalQtySpan=document.getElementById("totalQty");

const store=new MarketPOS();

</script>

</body>
</html>
