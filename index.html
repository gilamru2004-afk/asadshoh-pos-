<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asadshoh Shop 101 POS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
--green:#16a34a;
--yellow:#facc15;
--blue:#3b82f6;
--red:#ef4444;
}
body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#fef9c3,#bbf7d0);
color:#064e3b;
}
.login-screen{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#fef9c3,#bbf7d0);
z-index:9999;
}
.login-box{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}
.login-box input{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
width:250px;
}
.login-box button{
padding:10px 20px;
margin-top:15px;
background:var(--green);
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
.header{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
padding:20px;
font-size:26px;
font-weight:bold;
background:linear-gradient(90deg,var(--green),var(--yellow));
color:white;
}
.lock-btn{
cursor:pointer;
font-size:22px;
}
.container{
width:95%;
max-width:1200px;
margin:20px auto 420px auto;
}
.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
input,select,button{
padding:8px;
margin:5px;
border-radius:8px;
border:1px solid #d1fae5;
}
button{
cursor:pointer;
font-weight:bold;
border:none;
}
.btn{background:var(--green);color:white;}
.sell{background:var(--blue);color:white;}
.reset{background:var(--red);color:white;}
table{
width:100%;
border-collapse:collapse;
}
th,td{
padding:8px;
border-bottom:1px solid #d1fae5;
text-align:center;
}
.dashboard{
display:flex;
gap:20px;
flex-wrap:wrap;
}
.stat{
flex:1;
background:#dcfce7;
padding:15px;
border-radius:12px;
text-align:center;
}
.receipt-panel{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
color:black;
padding:15px;
font-family:Courier New,monospace;
border-top:5px solid var(--green);
max-height:400px;
overflow:auto;
display:none;
}
.close-btn{
position:absolute;
right:10px;
top:8px;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
<div class="login-box">
<h2>🔐 Kirish</h2>
<input type="password" id="loginPass" placeholder="Parol">
<br>
<button onclick="login()">Kirish</button>
<p id="loginError" style="color:red;"></p>
</div>
</div>

<div id="app" style="display:none;">

<div class="header">
🏪 ASADSHOH SHOP 101
<span class="lock-btn" onclick="lockApp()">🔒</span>
</div>

<div class="container">

<div class="card">
<h2>📦 Mahsulot qo‘shish</h2>
<input id="name" placeholder="Tovar nomi">
<input id="size" placeholder="Razmer">
<input id="qty" type="number" placeholder="Soni">
<input id="price" type="number" placeholder="Narxi (so‘m)">
<button class="btn" id="addBtn">Qo‘shish</button>
</div>

<div class="card">
<h2>🛒 Sotish</h2>
<select id="sellSelect"></select>
<input id="sellQty" type="number" placeholder="Soni">
<button class="sell" id="sellBtn">Sotish</button>
</div>

<div class="card dashboard">
<div class="stat">
<h3>📅 Bugungi</h3>
<span id="todaySum">0 so‘m</span>
</div>
<div class="stat">
<h3>📊 Umumiy</h3>
<span id="totalSum">0 so‘m</span>
</div>
</div>

<div class="card">
<button class="reset" onclick="store.resetReport()">Hisobotni reset</button>
</div>

<div class="card">
<h2>🧾 Cheklar Arxivi</h2>
<input id="searchInput" placeholder="Chek ID qidirish">
<table>
<thead>
<tr>
<th>ID</th>
<th>Sana</th>
<th>Summa</th>
<th>Ko‘rish</th>
</tr>
</thead>
<tbody id="receiptTable"></tbody>
</table>
</div>

</div>
</div>

<div class="receipt-panel" id="receiptPanel"></div>

<script>

function login(){
if(loginPass.value==="Asad2004@"){
loginScreen.style.display="none";
app.style.display="block";
}else{
loginError.innerText="Parol noto‘g‘ri!";
}
}

function lockApp(){
app.style.display="none";
loginScreen.style.display="flex";
loginPass.value="";
}

class POS{
constructor(){
this.products=JSON.parse(localStorage.getItem("products"))||[];
this.receipts=JSON.parse(localStorage.getItem("receipts"))||[];
this.init();
}

formatMoney(num){
return num.toLocaleString('uz-UZ')+" so‘m";
}

init(){
addBtn.onclick=()=>this.addProduct();
sellBtn.onclick=()=>this.sellProduct();
searchInput.oninput=()=>this.renderReceipts(searchInput.value);

document.addEventListener("keydown",(e)=>{
if(e.key==="Enter"){
if(document.activeElement.id==="sellQty") this.sellProduct();
else this.addProduct();
}
});

this.render();
}

save(){
localStorage.setItem("products",JSON.stringify(this.products));
localStorage.setItem("receipts",JSON.stringify(this.receipts));
}

addProduct(){
if(!name.value||!size.value||!qty.value||!price.value) return alert("To‘liq kiriting");
this.products.push({
id:Date.now(),
name:name.value,
size:size.value,
qty:parseInt(qty.value),
price:parseInt(price.value)
});
this.save();
this.render();
}

sellProduct(){
const id=parseInt(sellSelect.value);
const qtyVal=parseInt(sellQty.value);
const product=this.products.find(p=>p.id===id);
if(!product||qtyVal<=0||product.qty<qtyVal) return alert("Yetarli emas");

product.qty-=qtyVal;
const total=qtyVal*product.price;

const receipt={
id:"R"+Date.now(),
name:product.name,
size:product.size,
qty:qtyVal,
total,
date:new Date().toLocaleString()
};

this.receipts.unshift(receipt);
this.save();
this.render();
this.showReceipt(receipt);
}

showReceipt(r){
receiptPanel.style.display="block";
receiptPanel.innerHTML=`
<div style="position:relative">
<div class="close-btn" onclick="receiptPanel.style.display='none'">❌</div>
<div class="close-btn" style="right:40px;" onclick="lockApp()">🔒</div>
🦁 ASADSHOH SHOP 101<br>
📞 +998 99 086 75 05<br>
<hr>
${r.name} (${r.size})<br>
${r.qty} dona<br>
<b>${this.formatMoney(r.total)}</b><br>
${r.date}
<div id="qrcode"></div>
</div>
`;
document.getElementById("qrcode").innerHTML="";
new QRCode(document.getElementById("qrcode"),{
text:r.id+" "+r.total,
width:100,height:100
});
}

render(){
sellSelect.innerHTML="";
this.products.forEach(p=>{
if(p.qty>0)
sellSelect.innerHTML+=`<option value="${p.id}">${p.name} (${p.size}) - ${p.qty}</option>`;
});
this.updateStats();
this.renderReceipts();
}

renderReceipts(filter=""){
receiptTable.innerHTML="";
this.receipts
.filter(r=>r.id.includes(filter))
.forEach(r=>{
receiptTable.innerHTML+=`
<tr>
<td>${r.id}</td>
<td>${r.date}</td>
<td>${this.formatMoney(r.total)}</td>
<td><button onclick='store.showReceipt(${JSON.stringify(r)})'>Ko‘rish</button></td>
</tr>`;
});
}

updateStats(){
let total=0;
let today=0;
const todayDate=new Date().toDateString();

this.receipts.forEach(r=>{
total+=r.total;
if(new Date(r.date).toDateString()===todayDate){
today+=r.total;
}
});

totalSum.innerText=this.formatMoney(total);
todaySum.innerText=this.formatMoney(today);
}

resetReport(){
if(prompt("Admin parol")!=="101") return alert("Xato");
this.receipts=[];
this.save();
this.render();
}
}

const name=document.getElementById("name");
const size=document.getElementById("size");
const qty=document.getElementById("qty");
const price=document.getElementById("price");
const sellSelect=document.getElementById("sellSelect");
const sellQty=document.getElementById("sellQty");
const receiptPanel=document.getElementById("receiptPanel");
const receiptTable=document.getElementById("receiptTable");
const searchInput=document.getElementById("searchInput");
const totalSum=document.getElementById("totalSum");
const todaySum=document.getElementById("todaySum");
const addBtn=document.getElementById("addBtn");
const sellBtn=document.getElementById("sellBtn");

const store=new POS();

</script>

</body>
</html>
