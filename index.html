<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Bosmenti Premium ERP</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}
header{background:#111;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid gold}
h1{color:gold;margin:0}
.section{background:#1c1c1c;margin:15px;padding:15px;border-radius:10px}
input,button{padding:6px;margin:4px;background:#222;color:#fff;border:1px solid #444}
button{background:gold;color:black;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #333;padding:6px;text-align:center}
.late{background:#7a0000}
.hidden{display:none}
#login{position:fixed;width:100%;height:100%;background:black;display:flex;justify-content:center;align-items:center;flex-direction:column}
.clock{color:gold;font-weight:bold}
canvas{background:white;border-radius:10px;margin-top:15px}
.result{font-size:18px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>

<div id="login">
<h2>⭐ BOSMENTI PREMIUM 🔒</h2>
<input type="password" id="password" placeholder="Parol">
</div>

<header>
<h1>⭐ BOSMENTI PREMIUM</h1>
<div>
<span id="clock" class="clock"></span>
<button onclick="lock()">🔒</button>
</div>
</header>

<div id="app" class="hidden">

<!-- OMBOR -->
<div class="section">
<h2>📦 Ombor</h2>
<input id="on" placeholder="Nomi">
<input id="or" placeholder="Razmer">
<input type="number" id="os" placeholder="Soni">
<input type="number" id="ot" placeholder="Tannarx">
<button onclick="addOmbor()">Qo‘shish</button>
<table id="omborTable"></table>
</div>

<!-- DOKON -->
<div class="section">
<h2>🏬 Do‘kon</h2>
<input id="dn" placeholder="Nomi">
<input id="dr" placeholder="Razmer">
<input type="number" id="ds" placeholder="Soni">
<button onclick="moveToShop()">Ombordan olish</button>
<table id="shopTable"></table>
</div>

<!-- SOTUV -->
<div class="section">
<h2>🛒 Sotuv</h2>
<input id="sn" placeholder="Nomi">
<input id="sr" placeholder="Razmer">
<input type="number" id="ss" placeholder="Soni">
<input type="number" id="sp" placeholder="Sotuv narxi">
<button onclick="sell()">Sotish</button>
<table id="sellTable">
<tr><th>Nomi</th><th>Razmer</th><th>Soni</th><th>Sotuv</th><th>Foyda</th></tr>
</table>
</div>

<!-- XARAJAT -->
<div class="section">
<h2>💸 Xarajat</h2>
<input id="xn" placeholder="Nimaga">
<input type="number" id="xs" placeholder="Summa">
<button onclick="addXarajat()">Qo‘shish</button>
</div>

<!-- NASIYA -->
<div class="section">
<h2>💰 Nasiyalar</h2>
<input id="ni" placeholder="Kimdan">
<input id="nt" placeholder="Telefon">
<input type="number" id="ns" placeholder="Summa">
<input type="date" id="nd">
<button onclick="addNas()">Qo‘shish</button>
<table id="nasTable">
<tr><th>Ism</th><th>Tel</th><th>Summa</th><th>Sana</th></tr>
</table>
</div>

<!-- QARZ -->
<div class="section">
<h2>📤 Qarzlar</h2>
<input id="qi" placeholder="Kimga">
<input type="number" id="qs" placeholder="Summa">
<input type="date" id="qd">
<button onclick="addQarz()">Qo‘shish</button>
</div>

<!-- HISOBOT -->
<div class="section">
<h2>📊 Hisobot</h2>
<button onclick="report()">Hisoblash</button>
<button onclick="closeDay()">📦 Kunni yopish</button>
<div id="result" class="result"></div>
<canvas id="chart"></canvas>

<h3>📁 Kunlik Arxiv</h3>
<table id="archiveTable">
<tr>
<th>Sana</th>
<th>Foyda</th>
<th>Xarajat</th>
<th>Nasiyalar</th>
<th>Qarz</th>
<th>Balans</th>
</tr>
</table>

</div>

</div>

<script>
let ombor=JSON.parse(localStorage.getItem("ombor"))||[];
let shop=JSON.parse(localStorage.getItem("shop"))||[];
let archive=JSON.parse(localStorage.getItem("archive"))||[];

let totalFoyda=0,totalX=0,totalNas=0,totalQ=0;
let chart;

function save(){
localStorage.setItem("ombor",JSON.stringify(ombor));
localStorage.setItem("shop",JSON.stringify(shop));
localStorage.setItem("archive",JSON.stringify(archive));
}

function format(n){return Number(n).toLocaleString("ru-RU")}
password.addEventListener("input",()=>{
if(password.value==="7777"){
login.style.display="none";
app.classList.remove("hidden");
render();
renderArchive();
}
});

function lock(){
app.classList.add("hidden");
login.style.display="flex";
password.value="";
}

setInterval(()=>{clock.innerText=new Date().toLocaleString()},1000);

function addOmbor(){
let item=ombor.find(p=>p.n==on.value && p.r==or.value);
if(item)item.s+=+os.value;
else ombor.push({n:on.value,r:or.value,s:+os.value,t:+ot.value});
save();render();
}

function moveToShop(){
let item=ombor.find(p=>p.n==dn.value && p.r==dr.value);
if(!item||item.s<+ds.value){alert("Yetarli emas");return;}
item.s-=+ds.value;
let sItem=shop.find(p=>p.n==dn.value&&p.r==dr.value);
if(sItem)sItem.s+=+ds.value;
else shop.push({n:item.n,r:item.r,s:+ds.value,t:item.t});
save();render();
}

function sell(){
let item=shop.find(p=>p.n==sn.value && p.r==sr.value);
if(!item){alert("Yo‘q");return;}
if(item.s<+ss.value){
let need=+ss.value-item.s;
let om=ombor.find(p=>p.n==sn.value && p.r==sr.value);
if(!om||om.s<need){alert("Yetarli emas");return;}
om.s-=need;item.s+=need;
}
item.s-=+ss.value;
let profit=(+sp.value-item.t)*+ss.value;
totalFoyda+=profit;

sellTable.innerHTML+=`<tr>
<td>${sn.value}</td>
<td>${sr.value}</td>
<td>${ss.value}</td>
<td>${format(sp.value)}</td>
<td>${format(profit)}</td>
</tr>`;
save();render();
}

function addXarajat(){totalX+=+xs.value}
function addNas(){
let late=(nd.value<=new Date().toISOString().split("T")[0])?"late":"";
totalNas+=+ns.value;
nasTable.innerHTML+=`<tr class="${late}">
<td>${ni.value}</td>
<td>${nt.value}</td>
<td>${format(ns.value)}</td>
<td>${nd.value}</td>
</tr>`;
}
function addQarz(){totalQ+=+qs.value}

function report(){
let om=ombor.reduce((a,b)=>a+b.s*b.t,0);
let sh=shop.reduce((a,b)=>a+b.s*b.t,0);
let balans=totalFoyda-totalX-totalQ+totalNas;

result.innerHTML=`
Ombor: ${format(om)}<br>
Do‘kon: ${format(sh)}<br>
Foyda: ${format(totalFoyda)}<br>
Xarajat: ${format(totalX)}<br>
Nasiyalar: ${format(totalNas)}<br>
Qarzlar: ${format(totalQ)}<br><br>
Yakuniy balans: ${format(balans)}
`;

if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["Ombor","Do‘kon","Foyda","Xarajat","Nasiyalar","Qarz"],
datasets:[{
data:[om,sh,totalFoyda,totalX,totalNas,totalQ],
backgroundColor:["gold","blue","green","red","purple","orange"]
}]
}
});
}

function closeDay(){
let today=new Date().toLocaleDateString();
let balans=totalFoyda-totalX-totalQ+totalNas;

archive.push({
date:today,
foyda:totalFoyda,
xarajat:totalX,
nas:totalNas,
qarz:totalQ,
balans:balans
});

totalFoyda=0;totalX=0;totalNas=0;totalQ=0;
sellTable.innerHTML=`<tr><th>Nomi</th><th>Razmer</th><th>Soni</th><th>Sotuv</th><th>Foyda</th></tr>`;

save();
renderArchive();
report();
alert("Kun yopildi!");
}

function renderArchive(){
archiveTable.innerHTML=`<tr>
<th>Sana</th><th>Foyda</th><th>Xarajat</th>
<th>Nasiyalar</th><th>Qarz</th><th>Balans</th></tr>`;
archive.forEach(a=>{
archiveTable.innerHTML+=`<tr>
<td>${a.date}</td>
<td>${format(a.foyda)}</td>
<td>${format(a.xarajat)}</td>
<td>${format(a.nas)}</td>
<td>${format(a.qarz)}</td>
<td>${format(a.balans)}</td>
</tr>`;
});
}

function render(){
omborTable.innerHTML="<tr><th>Nomi</th><th>Razmer</th><th>Soni</th><th>Tannarx</th><th>Jami</th></tr>";
ombor.forEach(p=>{
if(p.s>0)omborTable.innerHTML+=`<tr>
<td>${p.n}</td><td>${p.r}</td><td>${p.s}</td>
<td>${format(p.t)}</td><td>${format(p.s*p.t)}</td></tr>`;
});
shopTable.innerHTML="<tr><th>Nomi</th><th>Razmer</th><th>Soni</th><th>Tannarx</th><th>Jami</th></tr>";
shop.forEach(p=>{
if(p.s>0)shopTable.innerHTML+=`<tr>
<td>${p.n}</td><td>${p.r}</td><td>${p.s}</td>
<td>${format(p.t)}</td><td>${format(p.s*p.t)}</td></tr>`;
});
}

render();
renderArchive();
</script>

</body>
</html>
