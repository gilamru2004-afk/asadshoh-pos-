<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asadshoh Shop 101 POS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
--green:#16a34a;
--yellow:#facc15;
--blue:#3b82f6;
--red:#ef4444;
}

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#fef9c3,#bbf7d0);
color:#064e3b;
overflow-x:hidden;
position:relative;
}

/* Animated leaves */
body::before{
content:"🍃 🍂 🍃 🍂 🍃 🍂 🍃 🍂 🍃 🍂 🍃 🍂";
position:fixed;
top:-40px;
left:0;
width:200%;
font-size:40px;
opacity:0.15;
animation:leafMove 50s linear infinite;
pointer-events:none;
}
@keyframes leafMove{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

.header{
text-align:center;
padding:20px;
font-size:30px;
font-weight:bold;
background:linear-gradient(90deg,var(--green),var(--yellow));
color:white;
letter-spacing:2px;
}

.container{
width:95%;
max-width:1200px;
margin:20px auto 420px auto;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

input,select,button{
padding:8px;
margin:5px;
border-radius:8px;
border:1px solid #d1fae5;
}

button{
cursor:pointer;
font-weight:bold;
border:none;
}

.btn{background:var(--green);color:white;}
.sell{background:var(--blue);color:white;}
.reset{background:var(--red);color:white;}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #d1fae5;
text-align:center;
}

.dashboard{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.stat{
flex:1;
background:#dcfce7;
padding:15px;
border-radius:12px;
text-align:center;
}

.receipt-panel{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
color:black;
padding:15px;
font-family:Courier New,monospace;
border-top:5px solid var(--green);
max-height:400px;
overflow:auto;
display:none;
}

.close-btn{
position:absolute;
right:10px;
top:8px;
cursor:pointer;
font-weight:bold;
}

.logo{text-align:center;}
.lion{font-size:30px;}
.line{border-top:1px dashed black;margin:6px 0;}
#qrcode{display:flex;justify-content:center;margin-top:10px;}
</style>
</head>

<body>

<div class="header">🏪 ASADSHOH SHOP 101</div>

<div class="container">

<div class="card">
<h2>📦 Mahsulot qo‘shish</h2>
<input id="name" placeholder="Tovar nomi">
<input id="size" placeholder="Razmer">
<input id="qty" type="number" placeholder="Soni">
<input id="price" type="number" placeholder="Narxi">
<button class="btn" id="addBtn">Qo‘shish</button>
</div>

<div class="card">
<h2>🛒 Sotish</h2>
<select id="sellSelect"></select>
<input id="sellQty" type="number" placeholder="Soni">
<button class="sell" id="sellBtn">Sotish</button>
</div>

<div class="card dashboard">
<div class="stat">
<h3>📅 Bugungi savdo</h3>
Summa: <span id="todaySum">0</span><br>
Dona: <span id="todayQty">0</span>
</div>
<div class="stat">
<h3>📊 Umumiy savdo</h3>
Summa: <span id="totalSum">0</span><br>
Dona: <span id="totalQty">0</span>
</div>
</div>

<div class="card">
<button class="reset" onclick="store.resetReport()">Hisobotni reset qilish</button>
</div>

<div class="card">
<h2>🧾 Cheklar Arxivi</h2>
<input id="searchInput" placeholder="Chek ID qidirish">
<table>
<thead>
<tr>
<th>ID</th>
<th>Sana</th>
<th>Summa</th>
<th>Ko‘rish</th>
</tr>
</thead>
<tbody id="receiptTable"></tbody>
</table>
</div>

</div>

<div class="receipt-panel" id="receiptPanel"></div>

<script>
class POS{
constructor(){
this.products=JSON.parse(localStorage.getItem("products"))||[];
this.receipts=JSON.parse(localStorage.getItem("receipts"))||[];
this.init();
}

init(){
addBtn.onclick=()=>this.addProduct();
sellBtn.onclick=()=>this.sellProduct();
searchInput.oninput=()=>this.renderReceipts(searchInput.value);

document.addEventListener("keydown",(e)=>{
if(e.key==="Enter"){
if(document.activeElement.id==="sellQty") this.sellProduct();
else this.addProduct();
}
});

this.render();
}

save(){
localStorage.setItem("products",JSON.stringify(this.products));
localStorage.setItem("receipts",JSON.stringify(this.receipts));
}

addProduct(){
const name=nameInput.value.trim();
const size=sizeInput.value.trim();
const qty=parseInt(qtyInput.value);
const price=parseInt(priceInput.value);
if(!name||!size||!qty||!price) return alert("To‘liq kiriting");
this.products.push({id:Date.now(),name,size,qty,price});
this.save();
this.render();
}

sellProduct(){
const id=parseInt(sellSelect.value);
const qty=parseInt(sellQty.value);
const product=this.products.find(p=>p.id===id);
if(!product||qty<=0||product.qty<qty) return alert("Xato yoki yetarli emas");

product.qty-=qty;
const total=qty*product.price;
const now=new Date();

const receipt={
id:"R"+Date.now(),
name:product.name,
size:product.size,
qty,
total,
date:now.toLocaleString(),
raw:now.toISOString()
};

this.receipts.unshift(receipt);
this.save();
this.render();
this.showReceipt(receipt);
}

showReceipt(r){
receiptPanel.style.display="block";
receiptPanel.innerHTML=`
<div style="position:relative">
<div class="close-btn" onclick="store.closeReceipt()">❌</div>
<div class="logo">
<div class="lion">🦁</div>
<b>ASADSHOH SHOP 101</b><br>
📞 +998 99 086 75 05
</div>
<div class="line"></div>
Chek ID: ${r.id}<br>
${r.name} (${r.size})<br>
${r.qty} dona<br>
<div class="line"></div>
<b>JAMI: ${r.total} so‘m</b><br>
${r.date}
<div id="qrcode"></div>
<div class="line"></div>
<center>Rahmat!</center>
</div>
`;
document.getElementById("qrcode").innerHTML="";
new QRCode(document.getElementById("qrcode"),{
text:`ASADSHOH SHOP 101 | ${r.id} | ${r.total} so‘m`,
width:100,height:100
});
}

closeReceipt(){
receiptPanel.style.display="none";
}

render(){
sellSelect.innerHTML="";
this.products.forEach(p=>{
if(p.qty>0)
sellSelect.innerHTML+=`<option value="${p.id}">${p.name} (${p.size}) - ${p.qty}</option>`;
});
this.renderReceipts();
this.updateStats();
}

renderReceipts(filter=""){
receiptTable.innerHTML="";
this.receipts
.filter(r=>r.id.includes(filter))
.forEach(r=>{
receiptTable.innerHTML+=`
<tr>
<td>${r.id}</td>
<td>${r.date}</td>
<td>${r.total}</td>
<td><button onclick='store.showReceipt(${JSON.stringify(r)})'>Ko‘rish</button></td>
</tr>`;
});
}

updateStats(){
let todaySum=0,todayQty=0,totalSum=0,totalQty=0;
const today=new Date().toDateString();

this.receipts.forEach(r=>{
totalSum+=r.total;
totalQty+=r.qty;
if(new Date(r.raw).toDateString()===today){
todaySum+=r.total;
todayQty+=r.qty;
}
});

document.getElementById("todaySum").innerText=todaySum;
document.getElementById("todayQty").innerText=todayQty;
document.getElementById("totalSum").innerText=totalSum;
document.getElementById("totalQty").innerText=totalQty;
}

resetReport(){
const pass=prompt("Admin parol:");
if(pass!=="101") return alert("Parol noto‘g‘ri!");
if(!confirm("Hamma savdo hisobotlari o‘chadi!")) return;
this.receipts=[];
localStorage.setItem("receipts",JSON.stringify(this.receipts));
this.render();
}
}

const nameInput=document.getElementById("name");
const sizeInput=document.getElementById("size");
const qtyInput=document.getElementById("qty");
const priceInput=document.getElementById("price");
const sellSelect=document.getElementById("sellSelect");
const sellQty=document.getElementById("sellQty");
const receiptPanel=document.getElementById("receiptPanel");
const receiptTable=document.getElementById("receiptTable");
const searchInput=document.getElementById("searchInput");
const addBtn=document.getElementById("addBtn");
const sellBtn=document.getElementById("sellBtn");

const store=new POS();
</script>

</body>
</html>
